# Lint, test and build Wisp on Windows (T.4). The build job uploads the one-folder app and the
# installer as artefacts. Sources: docs.github.com/actions (runs-on windows-latest,
# actions/checkout, actions/setup-python, actions/upload-artifact). checkout@v7, setup-python@v7 and
# upload-artifact@v7 run on Node 24 (their action.yml); the v4/v5 majors ran on the deprecated Node 20.
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Lint
        run: ruff check src tests packaging

      - name: Tests
        run: python -m pytest -q -p no:cacheprovider

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build exe, self-check and installer
        run: python packaging/build.py

      - uses: actions/upload-artifact@v7
        with:
          name: Wisp-app-${{ github.sha }}
          path: dist/Wisp/
          if-no-files-found: error

      - uses: actions/upload-artifact@v7
        with:
          name: Wisp-installer-${{ github.sha }}
          path: dist/WispSetup-*.exe
          if-no-files-found: error

  # Pushing a tag "v<version>" (the version in pyproject.toml) publishes a GitHub Release with the
  # installer this run built and tested, and the notes in docs/releases/<tag>.md. Sources:
  # cli.github.com/manual/gh_release_create; docs.github.com "Using GitHub CLI in workflows"
  # (preinstalled on hosted runners, GH_TOKEN); actions/download-artifact@v8 (node24).
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test-and-build
    runs-on: ubuntu-latest
    permissions:
      contents: write  # create the release and upload its asset; every other job only reads
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: Wisp-installer-${{ github.sha }}
          path: dist

      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' pyproject.toml)
          if [ "$TAG" != "v$version" ]; then
            echo "::error title=Release::Tag $TAG doesn't match the version $version in pyproject.toml"
            exit 1
          fi
          gh release create "$TAG" "dist/WispSetup-$version.exe#WispSetup-$version.exe (Windows installer)" \
            --verify-tag --title "Wisp $version" --notes-file "docs/releases/$TAG.md"
