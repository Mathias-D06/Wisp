[build-system]
requires = ["setuptools>=77"]  # PEP 639 licence fields
build-backend = "setuptools.build_meta"

[project]
name = "wisp"
version = "0.1.1"
description = "Wisp: a Gemini-powered voice assistant for Windows"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12,<3.13"
dependencies = [
    "google-genai==2.29.0",
    "PySide6-Essentials==6.12.0",
    "sounddevice==0.5.6",
    "numpy==2.5.4",
    "mss==10.2.0",
    "comtypes==1.4.17",
    "pycaw==20260927",
    "pywin32==312",
    "winrt-runtime==3.2.1",
    "winrt-Windows.Foundation==3.2.1",
    "winrt-Windows.Foundation.Collections==3.2.1",
    "winrt-Windows.Media.Control==3.2.1",
    "winrt-Windows.Storage.Streams==3.2.1",
    "winrt-Windows.Devices.Radios==3.2.1",
    "winrt-Windows.Networking==3.2.1",
    "winrt-Windows.Networking.Connectivity==3.2.1",
    "APScheduler==3.11.3",
    "SQLAlchemy==2.1.4",
    "rapidfuzz==3.14.6",
    "Pillow==12.3.0",
    "google-api-python-client==2.201.0",
    "google-auth-oauthlib==1.5.0",
    "google-auth-httplib2==0.4.4",
    "segno==1.6.6",
]

[project.optional-dependencies]
dev = [
    "ruff==0.17.0",
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "pytest-qt==4.5.0",
    "pyinstaller==6.22.3",
    "dnfile==0.18.0",  # spikes/winmd_dump.py only (reads Windows' WinRT metadata)
]

[project.scripts]
wisp = "wisp.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
wisp = ["assets/icons/*.svg", "assets/icons/*.txt"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"src/wisp/ui/theme.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "windows: needs Windows APIs (skipped elsewhere)",
    "qt: needs a Qt application instance",
]
filterwarnings = [
    "ignore::DeprecationWarning:apscheduler.*",
]
